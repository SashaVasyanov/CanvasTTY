name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  # unit tests, the interface in a browser and the real app in Electron — on Windows and Linux
  test:
    name: test (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Browser for the tests (Windows uses the preinstalled Edge)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      # every group runs even when an earlier one failed, so one run shows all failures
      - name: Interface in a browser
        if: success() || failure()
        run: npx playwright test --project=browser --output=test-results/browser
      - name: Real app in Electron
        if: (success() || failure()) && runner.os == 'Windows'
        run: npx playwright test --project=electron --output=test-results/electron
      - name: Real app in Electron
        if: (success() || failure()) && runner.os == 'Linux'
        run: xvfb-run -a npx playwright test --project=electron --output=test-results/electron
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: test-results
          if-no-files-found: ignore

  build:
    name: build (${{ matrix.os }})
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: |
              release/*.exe
          - os: macos-latest
            args: --mac
            files: |
              release/*.dmg
              release/*-mac-*.zip
          - os: ubuntu-latest
            args: --linux
            files: |
              release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VibeTabula-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: warn
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
